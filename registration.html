<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Student Registration</title>
</head>
<body>
    <h1>Student Registration</h1>
    <form action="#" method="post" id="studentForm">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" name="studentName" required><br><br>

        <label for="regNo">Registration Number:</label>
        <input type="text" id="regNo" name="regNo" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="gender">Gender:</label>
      <input type="radio" id="male" name="gender" value="male" required>
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female" required>
      <label for="female">Female</label><br><br>

        <label for="programme">Programme:</label>
        <select id="programme" name="programme" required>
            <option value="">Select a programme</option>
            <option value="BSc Computer Science">BSc Computer Science</option>
            <option value="BSc Information Technology">BSc Information Technology</option>
            <option value="BSc Software Engineering">BSc Software Engineering</option>
        </select><br><br>

       
<input type="reset" value="Reset">
        <input type="submit" value="Submit">
        <div id="resultContainer" style="margin-top: 20px; font-weight: bold;"></div>
    </form>
    <script src="script.js"></script>
</body>
</html>
